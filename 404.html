<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Oliver King</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1014; color: #c8ced8;
           font: 15px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace; padding: 16px; box-sizing: border-box; }
    main { max-width: 70ch; width: 100%; }
    p { margin: 0 0 .5rem; overflow-wrap: anywhere; }
    .ps1 { color: #8fd18a; font-weight: 700; } .path { color: #82aaff; font-weight: 700; }
    .err { color: #ec7d7d; } .dim { color: #7a8291; }
    a { color: #82aaff; }
    .cursor { display: inline-block; width: .6em; height: 1.15em; vertical-align: -.2em; background: #c8ced8; animation: b 1.1s steps(1) infinite; }
    @keyframes b { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p><span class="ps1">oliver@nyc</span>:<span class="path">~</span>$ cd <span id="p">this-page</span></p>
    <p class="err">bash: cd: <span id="p2">this-page</span>: No such file or directory</p>
    <p class="dim">exit 404</p>
    <p><span class="ps1">oliver@nyc</span>:<span class="path">~</span>$ <a id="home" href="/">cd ~</a> <span class="cursor" aria-hidden="true"></span></p>
  </main>
  <script>
    var path = decodeURIComponent(location.pathname);
    document.getElementById("p").textContent = document.getElementById("p2").textContent = path;
    // Project pages live under /portfolio/; a custom domain serves from /.
    document.getElementById("home").href = path.indexOf("/portfolio/") === 0 ? "/portfolio/" : "/";
  </script>
</body>
</html>
